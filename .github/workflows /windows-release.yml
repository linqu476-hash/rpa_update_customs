name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onedir --name RPA_Update_Customs
          --collect-all streamlit --copy-metadata streamlit
          --add-data "app.py;." --add-data "rpa_customs.py;."
          --add-data "rpa_erp.py;." --add-data "excel_io.py;."
          --add-data "browser_setup.py;." --add-data "runner.py;."
          --add-data ".streamlit;.streamlit"
          launcher.py

      - name: Zip
        run: Compress-Archive -Path dist/RPA_Update_Customs -DestinationPath RPA_Update_Customs-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RPA_Update_Customs
          path: "*.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
